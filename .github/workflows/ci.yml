name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build && npm run format && npm audit --omit=dev
        working-directory: frontend
  training:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.10
      - run: uv python install 3.12
      - run: uv venv training/.venv --python 3.12 && uv pip sync training/requirements.lock --python training/.venv/bin/python --require-hashes
      - run: training/.venv/bin/ruff check training && training/.venv/bin/mypy training
  native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-13 g++-13 make pkg-config nasm libssl-dev zlib1g-dev uuid-dev libpng-dev libjpeg-dev
      - run: cmake --preset dependencies && cmake --build --preset dependencies
      - run: cmake --preset dev && cmake --build --preset dev && ctest --preset dev
