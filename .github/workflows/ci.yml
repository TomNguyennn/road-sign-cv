name: CI
on:
  pull_request:
  push:
    branches: [main, 001-assistive-sign-recognition]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.5
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build && npm run format && npm audit --omit=dev
        working-directory: frontend
  training:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.9.10
      - run: uv python install 3.12
      - run: uv venv training/.venv --python 3.12 && uv pip sync training/requirements.lock --python training/.venv/bin/python --require-hashes
      - run: training/.venv/bin/ruff check training && training/.venv/bin/ruff format --check training && training/.venv/bin/mypy training
      - name: Report deferred suites and release status
        run: |
          {
            echo '### Deferred checks'
            echo '- Full backend lifecycle, media-admission and event-order contracts: pending T009/T010 and T015-T019 completion.'
            echo '- Playwright accessibility workflows: pending T024.'
            echo '- Python model/evaluation tests: pending T022.'
            echo '- Release eligible: **false** until the full planned validation and real-model gate pass.'
          } >> "$GITHUB_STEP_SUMMARY"
  native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-13 g++-13 make pkg-config nasm libssl-dev zlib1g-dev uuid-dev libpng-dev libjpeg-dev
      - run: cmake --preset dependencies && cmake --build --preset dependencies
      - run: cmake --preset dev && cmake --build --preset dev && ctest --preset dev
  docker:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build --target backend-runtime -t road-sign-backend:ci .
      - run: docker build --target web-runtime -t road-sign-web:ci .
      - run: docker compose --env-file config/demo.env.example build && docker compose --env-file config/demo.env.example up -d
      - name: Wait for local HTTPS liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail --insecure https://localhost:8443/api/v1/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check session lifecycle, event stream, and upload snapshot
        run: |
          python3 - <<'PY'
          import http.cookiejar
          import json
          import socket
          import struct
          import ssl
          import time
          import urllib.error
          import urllib.request
          import zlib

          base = "https://localhost:8443/api/v1"
          cookie_jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()),
              urllib.request.HTTPCookieProcessor(cookie_jar),
          )

          def request(path, method="GET", body=None, headers=None, include_origin=True):
              request_headers = {"Origin": "https://localhost"} if include_origin else {}
              if headers:
                  request_headers.update(headers)
              data = None if body is None else json.dumps(body).encode()
              if data is not None:
                  request_headers["Content-Type"] = "application/json"
              return opener.open(urllib.request.Request(
                  base + path, data=data, headers=request_headers, method=method
              ), timeout=10)

          def png_chunk(kind, data):
              chunk = kind + data
              return struct.pack(">I", len(data)) + chunk + struct.pack(">I", zlib.crc32(chunk))

          def tiny_png():
              return (b"\x89PNG\r\n\x1a\n" + png_chunk(b"IHDR", struct.pack(">IIBBBBB", 1, 1, 8, 2, 0, 0, 0))
                      + png_chunk(b"IDAT", zlib.compress(b"\x00\x00\x00\x00")) + png_chunk(b"IEND", b""))

          def upload(path, attempt_id, content):
              boundary = "road-sign-ci-boundary"
              body = (f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"sign.png\"\r\n"
                      "Content-Type: image/png\r\n\r\n").encode() + content + f"\r\n--{boundary}--\r\n".encode()
              headers = {"Origin": "https://localhost", "X-CSRF-Token": csrf,
                         "X-Epoch": "1", "X-Upload-Attempt-Id": attempt_id,
                         "Content-Type": f"multipart/form-data; boundary={boundary}"}
              return opener.open(urllib.request.Request(
                  base + path, data=body, headers=headers, method="POST"
              ), timeout=10)

          def read_upload_event(expected_status):
              deadline = time.monotonic() + 10
              while True:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise AssertionError(f"timed out waiting for upload.state {expected_status}")
                  events.fp.raw._sock.settimeout(remaining)
                  try:
                      lines = []
                      while line := events.readline().strip():
                          lines.append(line)
                  except socket.timeout as error:
                      raise AssertionError(f"timed out waiting for upload.state {expected_status}") from error
                  event = next((line for line in lines if line.startswith(b"event: ")), b"")
                  data = next((line[6:] for line in lines if line.startswith(b"data: ")), b"")
                  if event == b"event: upload.state" and data:
                      envelope = json.loads(data)
                      if envelope["payload"]["uploadStatus"] == expected_status:
                          return envelope

          try:
              request("/sessions", "POST", {"sourceKind": "image", "unexpected": True})
          except urllib.error.HTTPError as error:
              assert error.code == 400
          else:
              raise AssertionError("unknown session fields were accepted")
          try:
              request("/sessions", "POST", {"sourceKind": "image"}, {"Origin": "https://wrong.example"})
          except urllib.error.HTTPError as error:
              assert error.code == 403
          else:
              raise AssertionError("wrong-origin session creation was accepted")
          created = request("/sessions", "POST", {"sourceKind": "image"})
          assert created.status == 201
          session = json.loads(created.read())
          session_id = session["sessionId"]
          csrf = session["csrfToken"]
          cookie = next(item.value for item in cookie_jar if item.name == "rs_session")
          assert len(cookie) == 64 and cookie != session_id and cookie != csrf
          other_client = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ssl._create_unverified_context()))
          try:
              other_client.open(base + f"/sessions/{session_id}/upload-status", timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("another client read the upload receipt")
          try:
              other_client.open(urllib.request.Request(
                  base + f"/sessions/{session_id}/upload-status",
                  headers={"Cookie": "rs_session=wrong-client"}), timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("wrong-cookie client read the upload receipt")

          events = request(f"/sessions/{session_id}/events", headers={"Accept": "text/event-stream"}, include_origin=False)
          assert events.readline().strip() == b"event: session.ready"
          ready_envelope = json.loads(events.readline()[6:])
          assert ready_envelope["type"] == "session.ready" and ready_envelope["eventSeq"] == 1
          try:
              request(f"/sessions/{session_id}/events", headers={"Accept": "text/event-stream"}, include_origin=False)
          except urllib.error.HTTPError as error:
              assert error.code == 409
          else:
              raise AssertionError("second event stream attachment was accepted")

          try:
              request(f"/sessions/{session_id}/heartbeat", "POST", {"epoch": 2},
                      {"X-CSRF-Token": csrf})
          except urllib.error.HTTPError as error:
              assert error.code == 410
          else:
              raise AssertionError("stale heartbeat was accepted")
          heartbeat = request(
              f"/sessions/{session_id}/heartbeat", "POST", {"epoch": 1},
              {"X-CSRF-Token": csrf},
          )
          assert heartbeat.status == 204
          status = request(f"/sessions/{session_id}/upload-status", include_origin=False)
          assert json.loads(status.read())["uploadStatus"] == "idle"
          first_attempt = "edc6258a-a013-467e-ace1-865af6048911"
          try:
              upload(f"/sessions/{session_id}/media", first_attempt,
                     b"RS_PRIVACY_CANARY_DO_NOT_LOG").close()
          except urllib.error.HTTPError as error:
              assert error.code == 422
          else:
              raise AssertionError("invalid image was accepted")
          first_receiving = read_upload_event("receiving")
          first_validating = read_upload_event("validating")
          rejected = read_upload_event("rejected")
          assert first_receiving["stateRevision"] < first_validating["stateRevision"] < rejected["stateRevision"]
          assert rejected["payload"]["uploadAttemptsUsed"] == 1
          assert rejected["payload"]["canRetryUpload"] is True
          try:
              upload(f"/sessions/{session_id}/media", first_attempt, b"invalid image").close()
          except urllib.error.HTTPError as error:
              assert error.code == 409
          else:
              raise AssertionError("duplicate upload attempt was accepted")
          second_attempt = "d37f3719-c17a-4c7c-9a3d-8441d4f42722"
          accepted = upload(f"/sessions/{session_id}/media", second_attempt, tiny_png())
          assert accepted.status == 202
          assert json.loads(accepted.read())["uploadStatus"] == "accepted"
          second_receiving = read_upload_event("receiving")
          second_validating = read_upload_event("validating")
          accepted_event = read_upload_event("accepted")
          assert second_receiving["stateRevision"] < second_validating["stateRevision"] < accepted_event["stateRevision"]
          assert accepted_event["eventSeq"] > rejected["eventSeq"]
          assert accepted_event["payload"]["uploadAttemptsUsed"] == 2
          status = request(f"/sessions/{session_id}/upload-status", include_origin=False)
          assert json.loads(status.read())["uploadStatus"] == "accepted"
          try:
              request(f"/sessions/{session_id}", "DELETE")
          except urllib.error.HTTPError as error:
              assert error.code == 403
          else:
              raise AssertionError("session deletion without CSRF was accepted")
          try:
              request(f"/sessions/{session_id}", "DELETE", {"unexpected": True},
                      {"X-CSRF-Token": csrf})
          except urllib.error.HTTPError as error:
              assert error.code == 400
          else:
              raise AssertionError("session deletion with a body was accepted")
          ended = request(f"/sessions/{session_id}", "DELETE", headers={"X-CSRF-Token": csrf})
          assert ended.status == 202
          assert json.loads(ended.read())["stateRevision"] >= session["stateRevision"]
          while True:
              lines = []
              while line := events.readline().strip():
                  lines.append(line)
              if b"event: session.ended" in lines:
                  break
          events.close()

          try:
              request(f"/sessions/{session_id}/upload-status")
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise AssertionError("ended session remained accessible")

          unattached = request("/sessions", "POST", {"sourceKind": "image"})
          assert unattached.status == 201
          unattached_id = json.loads(unattached.read())["sessionId"]
          time.sleep(12)
          replacement = request("/sessions", "POST", {"sourceKind": "image"})
          assert replacement.status == 201
          replacement_session = json.loads(replacement.read())
          assert replacement_session["sessionId"] != unattached_id
          assert request(f"/sessions/{replacement_session['sessionId']}", "DELETE",
                         headers={"X-CSRF-Token": replacement_session["csrfToken"]}).status == 202

          leased = request("/sessions", "POST", {"sourceKind": "camera"})
          lease_id = json.loads(leased.read())["sessionId"]
          lease_events = request(f"/sessions/{lease_id}/events",
                                 headers={"Accept": "text/event-stream"}, include_origin=False)
          lease_events.fp.raw._sock.settimeout(20)
          heartbeats = 0
          last_sequence = 0
          while True:
              raw_line = lease_events.readline()
              assert raw_line, "event stream closed before lease expiry"
              event_line = raw_line.strip()
              if not event_line:
                  continue
              assert event_line.startswith(b"event: ")
              data_line = lease_events.readline()
              assert data_line.startswith(b"data: ")
              envelope = json.loads(data_line[6:])
              assert envelope["eventSeq"] > last_sequence
              last_sequence = envelope["eventSeq"]
              if event_line == b"event: heartbeat":
                  heartbeats += 1
              if event_line == b"event: session.ended":
                  assert envelope["payload"]["reason"] == "leaseExpired"
                  break
          assert heartbeats >= 2
          lease_events.close()
          PY
      - name: Check session spool and log privacy
        run: |
          docker compose --env-file config/demo.env.example exec -T backend sh -c 'test -z "$(find /run/road-sign -type f -print -quit)"'
          if docker compose --env-file config/demo.env.example logs backend | grep -F 'RS_PRIVACY_CANARY_DO_NOT_LOG'; then
            exit 1
          fi
      - name: Check health and missing-model readiness
        run: |
          curl --silent --fail --insecure https://localhost:8443/api/v1/capabilities |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["catalogue"] == []'
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --insecure https://localhost:8443/api/v1/ready)
          test "$code" = 503
      - if: always()
        run: docker compose --env-file config/demo.env.example down --volumes
