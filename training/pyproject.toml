[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "road-sign-training"
version = "0.1.0"
description = "Offline training and evaluation tooling for assistive sign recognition"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.15.0",
  "torchvision==0.29.2",
  "ultralytics==8.4.218",
  "onnx==1.23.2",
  "onnxruntime==1.22.0",
  "numpy==2.5.5",
  "jiwer==4.0.0",
  "scikit-learn==1.9.1",
  "torchmetrics==1.9.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "mypy==2.4.1", "ruff==0.17.6", "build==1.6.1", "hatchling==1.33.0"]

[tool.hatch.build.targets.wheel]
packages = ["road_sign_training"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
